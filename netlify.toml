# Netlify config for code-challenge repo.
# Set Base directory in Netlify UI to: code-challenge/src/problem2
# Then build runs from that folder and publishes its dist.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
