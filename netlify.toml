# Netlify config for this repo.
# In Netlify UI set Base directory to: src/problem2
# (Repo root is the repo contents; there is no "code-challenge" folder inside.)

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
